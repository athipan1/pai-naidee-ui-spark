name: OSM Chonburi Live Smoke (manual branch)
on:
  push:
    branches: [fix/osm-discovery-timeout-reliability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  osm-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only Overpass smoke and duplicate classification
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {discover,toCandidates}=require('./api/place-discovery.cjs');
          (async()=>{
          const controller=new AbortController();
          const timer=setTimeout(()=>controller.abort(),12000);
          try {
            const query='[out:json][timeout:8];area["boundary"="administrative"]["admin_level"="4"]["name:th"="ชลบุรี"];out ids 2;';
            const response=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:new URLSearchParams({data:query}),signal:controller.signal});
            assert.equal(response.status,200,'Small province-area probe HTTP '+response.status);
            const payload=await response.json();
            assert.ok(Array.isArray(payload.elements)&&payload.elements.length>0,'Chonburi province area not resolved');
            console.log('SMALL_AREA_PROBE_PASS',payload.elements.map(x=>x.id));
          } finally {clearTimeout(timer);}
            const province='ชลบุรี';
            const getSql=()=>({begin:async(_mode,callback)=>callback(async()=>[])});
            const result=await discover({province,limit:10,getSql});
            assert.equal(result.province,province);
            assert.equal(result.automaticImport,false);
            assert.equal(result.publicationAllowed,false);
            assert.ok(result.candidates.length>0,'Live Overpass returned no attractions; province area may not resolve');
            assert.ok(result.candidates.every(x=>x.province===province && x.source==='osm' && Number.isFinite(x.lat) && Number.isFinite(x.lng)));
            const first=result.candidates[0];
            const duplicate=toCandidates([{type:'node',id:99999999,lat:first.lat,lon:first.lng,tags:{tourism:'attraction',name:first.name}}],province,[{name:first.name,name_local:'',lat:first.lat,lng:first.lng}],10);
            assert.equal(duplicate[0].duplicateStatus,'possible_duplicate');
            console.log(JSON.stringify({live:'PASS',province,count:result.candidates.length,sample:result.candidates.slice(0,3).map(x=>({name:x.name,sourceId:x.sourceId})),duplicateFixture:'PASS',productionDatabase:'NOT_QUERIED',noWrites:true}));
          })().catch(error=>{console.error('LIVE_SMOKE_FAILED',error.message);process.exitCode=1});
          NODE

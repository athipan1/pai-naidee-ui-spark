name: Production Read-Only Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:production-smoke

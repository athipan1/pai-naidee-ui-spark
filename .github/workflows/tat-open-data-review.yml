name: TAT Open Data Import Review

on:
  workflow_dispatch:
    inputs:
      province:
        description: 'Optional Thai province name; leave blank for all provinces'
        required: false
        default: ''
        type: string
      start_index:
        description: 'Continue from nextIndex in the previous report'
        required: false
        default: '174'
        type: string
      batch_size:
        description: 'Maximum reviewed candidates; hard limit 25'
        required: false
        default: '25'
        type: string
  push:
    branches:
      - feature/tat-open-data-staged-import
      - feature/tat-open-data-batch-002
      - feature/tat-open-data-batch-003
      - feature/tat-open-data-batch-004
      - feature/tat-chonburi-full-inventory-qa
    paths:
      - 'api/tat-open-data.cjs'
      - 'api/stage-tat-open-data.cjs'
      - 'api/tat-open-data.node-test.cjs'
      - 'api/chonburi-tat-inventory.cjs'
      - '.github/workflows/tat-open-data-review.yml'

permissions:
  contents: read

jobs:
  stage-review-batch:
    name: Download official source and audit a small batch
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TAT_CSV_URL: 'https://datacatalog.tat.or.th/dataset/87442079-88ec-42eb-b507-dcf135fc4301/resource/e3774497-a9d4-46f1-a3db-172d0aed5237/download/attraction.csv'
      REVIEW_PROVINCE: ${{ inputs.province || '' }}
      REVIEW_START: ${{ inputs.start_index || '174' }}
      REVIEW_SIZE: ${{ inputs.batch_size || '25' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        run: npm ci --prefix api --no-audit --no-fund
      - name: Test validation rules
        run: node --test api/tat-open-data.node-test.cjs
      - name: Download publicly licensed TAT CSV (read-only)
        run: >-
          curl --fail --location --show-error --silent
          --retry 2 --max-time 180
          --max-filesize 50000000
          --output "$RUNNER_TEMP/attraction.csv"
          "$TAT_CSV_URL"
      # The staging candidate set must use the already-published catalogue.
      # A feature branch may contain its proposed release; including those
      # additions in duplicate detection would incorrectly skip every new ID.
      - name: Compare candidates against published main seed
        shell: bash
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:api/postgres-db.cjs > api/postgres-db.cjs
      - name: Audit and stage first batch (no Railway credentials)
        shell: bash
        run: |
          args=(--input "$RUNNER_TEMP/attraction.csv" --output "$RUNNER_TEMP/tat-review-batch.json" --start-index "$REVIEW_START" --limit "$REVIEW_SIZE")
          if [[ -n "$REVIEW_PROVINCE" ]]; then args+=(--province "$REVIEW_PROVINCE"); fi
          node api/stage-tat-open-data.cjs "${args[@]}"
      - name: Review all Chon Buri source rows (no publication)
        if: github.ref_name == 'feature/tat-chonburi-full-inventory-qa'
        run: >-
          node api/chonburi-tat-inventory.cjs
          "$RUNNER_TEMP/attraction.csv"
          "$RUNNER_TEMP/chonburi-full-inventory.json"
          2b8d35bbcb58c12b5c57f7f52e95d418867d4892a962362567c0d28a5be51366
      - name: Attach full Chon Buri inventory
        if: always() && github.ref_name == 'feature/tat-chonburi-full-inventory-qa'
        uses: actions/upload-artifact@v4
        with:
          name: chonburi-full-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/chonburi-full-inventory.json
          if-no-files-found: warn
          retention-days: 14
      - name: Attach review manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tat-open-data-review-${{ github.run_id }}
          path: ${{ runner.temp }}/tat-review-batch.json
          if-no-files-found: warn
          retention-days: 14
